# 左半 (主控) OLED: Bongo Cat 跟随打字速度
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# 128x64 OLED 画布尺寸 (CANVAS_HEIGHT 必须 >= CANVAS_WIDTH 才能容纳缓冲区)
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=128
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128
